<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 185 120" width="185" height="120"
     role="img" aria-label="VELOUREA V V monogram">
  <title>VELOUREA - V.V mirrored monogram</title>
  <!--
    VELOUREA - V.V monogram. Same grid as the reference mark:
      u = 10 monoline · H = 120 · W = 185 · stem pitch 55 · double-mirror symmetry
    Four V's: two outer blades + a rhombus ring (V over inverted V) whose side
    vertices touch the stems. Rhombus half-diagonals 50 x 60, inner 36.983 x 44.38.
  -->
  <defs>
    <g id="half">
      <!-- rhombus ring -->
      <path d="M-5,-54 L0,-60 L50,0 L0,60 L-5,54
               L-5,38.38 L0,44.38 L36.983,0 L0,-44.38 L-5,-38.38 Z"/>
      <!-- V spine: full-height stem on the outer axis -->
      <path d="M50,-60 H60 V60 H50 Z"/>
      <!-- V blades: from the stem's corners to a point on the horizontal axis -->
      <path d="M60,-60 L92.5,0 L60,60 L50,57.466 L81.127,0 L50,-57.466 Z"/>
    </g>
  </defs>
  <g transform="translate(92.5 60)" fill="#000">
    <use href="#half"/>
    <use href="#half" transform="scale(-1 1)"/>
  </g>
</svg>
