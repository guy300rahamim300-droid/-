<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 185 120" width="185" height="120"
     role="img" aria-label="VELOUREA monogram E · V — Comb">
  <title>VELOUREA — E · V — Comb</title>
  <!--
    VELOUREA — E · V — Comb
    Reference grid, unchanged:  u = 10 (monoline) · H = 120 · W = 185 · stem pitch p = 55
      big ring/rhombus half-width 50  -> tangent to the outer stem (50 = 55 - 5)
      blades 30 degrees off vertical, tip on the horizontal axis at x = +-92.5
    Double-mirror symmetry: only the right half is drawn; scale(-1 1) makes the left.
    The half crosses x = 0 slightly so the copies overlap and no hairline seam appears.
  -->
  <defs>
    <g id="h">
      <path d="M-5,-54 L0,-60 L50,0 L0,60 L-5,54 L-5,38.38 L0,44.38 L36.983,0 L0,-44.38 L-5,-38.38 Z"/>
      <path d="M50,-60 H60 V60 H50 Z"/>
      <path d="M60,-60 H92.5 V-50 H60 Z"/>
      <path d="M60,-10 H92.5 V10 H60 Z"/>
      <path d="M60,50 H92.5 V60 H60 Z"/>
    </g>
  </defs>
  <g transform="translate(92.5 60)" fill="#000">
    <use href="#h"/>
    <use href="#h" transform="scale(-1 1)"/>
  </g>
</svg>
