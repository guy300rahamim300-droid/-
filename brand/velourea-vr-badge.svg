<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 155 120" width="155" height="120"
     role="img" aria-label="VELOUREA V R badge">
  <title>VELOUREA V R badge</title>
  <!--
    VELOUREA — compact V·R badge for small sizes (favicon, buttons, hardware, embroidery).
    Same grid: u = 10, H = 120, double-mirror symmetry, the V's vertex tangent to the R stem.
  -->
  <defs>
    <g id="h">
      <path d="M-5,-51.429 L0,-60 L35,0 L0,60 L-5,51.429
               L-5,31.582 L0,40.154 L23.423,0 L0,-40.154 L-5,-31.582 Z"/>
      <path d="M35,-60 H45 V60 H35 Z"/>
      <path fill-rule="evenodd" d="M45,-60 H57.5 A17.5,17.5 0 0 1 57.5,-25 H45 Z
                                   M45,-50 H57.5 A7.5,7.5 0 0 1 57.5,-35 H45 Z"/>
      <path fill-rule="evenodd" d="M45,25 H57.5 A17.5,17.5 0 0 1 57.5,60 H45 Z
                                   M45,35 H57.5 A7.5,7.5 0 0 1 57.5,50 H45 Z"/>
      <path d="M63.066,-25 L77.5,0 L63.066,25
               L51.519,25 L65.953,0 L51.519,-25 Z"/>
    </g>
  </defs>
  <g transform="translate(77.5 60)" fill="#000">
    <use href="#h"/>
    <use href="#h" transform="scale(-1 1)"/>
  </g>
</svg>
