<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 255 120" width="255" height="120"
     role="img" aria-label="VELOUREA V L R monogram">
  <title>VELOUREA V L R monogram</title>
  <!--
    VELOUREA — V·L·R monogram, built on the same system as the reference mark.
      u  = 10     stroke weight, monoline everywhere
      H  = 120    cap height (12u)          W = 255
      double-mirror symmetry: only the right half is drawn, scale(-1 1) makes the left.
      The half crosses x=0 a little so the two copies overlap — no hairline seam.
    Read from the centre outwards:
      V  rhombus ring, half-diagonals 35 x 60 (a V over an inverted V)
      L  stem on axis 40 + foot to x=75, 2u thick (two mirrored feet merged)
      R  stem on axis 90 + obround bowl (R=17.5, r=7.5, flat run 17.5)
         + leg at 30deg off vertical, ending in a point on the horizontal axis
    Tangency, as in the reference: the V's side vertex touches the L's stem at x=35.
    Rhythm: every counter is an obround or a rhombus; white channels are ~1u apart.
  -->
  <defs>
    <g id="h">
      <path d="M-5,-51.429 L0,-60 L35,0 L0,60 L-5,51.429
               L-5,31.582 L0,40.154 L23.423,0 L0,-40.154 L-5,-31.582 Z"/>
      <path d="M35,-60 H45 V60 H35 Z"/>
      <path d="M45,-10 H75 V10 H45 Z"/>
      <path d="M85,-60 H95 V60 H85 Z"/>
      <path fill-rule="evenodd" d="M95,-60 H107.5 A17.5,17.5 0 0 1 107.5,-25 H95 Z
                                   M95,-50 H107.5 A7.5,7.5 0 0 1 107.5,-35 H95 Z"/>
      <path fill-rule="evenodd" d="M95,25 H107.5 A17.5,17.5 0 0 1 107.5,60 H95 Z
                                   M95,35 H107.5 A7.5,7.5 0 0 1 107.5,50 H95 Z"/>
      <path d="M113.066,-25 L127.5,0 L113.066,25
               L101.519,25 L115.953,0 L101.519,-25 Z"/>
    </g>
  </defs>
  <g transform="translate(127.5 60)" fill="#000">
    <use href="#h"/>
    <use href="#h" transform="scale(-1 1)"/>
  </g>
</svg>
