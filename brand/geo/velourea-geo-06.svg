<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 185 120" width="185" height="120"
     role="img" aria-label="VELOUREA geometric monogram 06 ◇·◇·V">
  <title>VELOURÉA — 06 ◇·◇·V</title>
  <!--
    Built on the reference grid, unchanged:
      u = 10  monoline stroke      H = 120 (12u)      W = 185      p = 55 stem pitch
      R = 30 (=H/4)  r = 20  d = 20 (arc centre offset -> 2u straight run)
      Rb = 17.5 / 7.5            alpha = 30 deg blade, tip on the mid axis at x = +-92.5
      body half-width 50 -> tangent to the outer stem (50 = 55 - 5)
    Double-mirror symmetry: the right half is drawn, scale(-1 1) makes the left;
    it crosses x=0 slightly so the copies overlap and no hairline seam appears.
  -->
