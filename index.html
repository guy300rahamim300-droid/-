<style>
:root{
  --bg:#F2F2F7; --card:#FFF; --card2:#FFF; --ink:#11131A; --muted:#6E7280;
  --accent:#2F5597; --accent-soft:rgba(47,85,151,.12);
  --green:#2E9E6B; --red:#C0392B; --blue:#3B7DDD; --purple:#8E6BD1;
  --orange:#D98026; --pink:#D14F8E; --gray:#6B7280; --teal:#0E8A8A;
  --sep:rgba(60,60,67,.10); --fill:rgba(120,120,128,.12); --r:20px;
  --num:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Rubik,system-ui,sans-serif;
}
html.dark{
  --bg:#000; --card:#1C1C1E; --card2:#2C2C2E; --ink:#F2F2F7; --muted:#98989F;
  --accent:#6B9BE8; --accent-soft:rgba(107,155,232,.18);
  --sep:rgba(255,255,255,.10); --fill:rgba(120,120,128,.24);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{font-family:var(--ui);background:var(--bg);color:var(--ink);
  display:flex;align-items:center;justify-content:center}
#root{width:100%;max-width:440px;height:100dvh;position:relative;overflow:hidden;
  display:flex;flex-direction:column;background:var(--bg)}
@media(min-width:900px){body{background:#0B0D12}
  #root{height:820px;max-width:392px;border-radius:44px;box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 0 11px #000,0 0 0 13px #23262F}}
.safe{height:env(safe-area-inset-top,0px);flex:none}
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:110px}
.view::-webkit-scrollbar{display:none}
.pad{padding:0 15px}
.title{font-size:29px;font-weight:750;letter-spacing:-.5px;padding:12px 19px 10px;display:flex;align-items:center;gap:9px}
.title .act{margin-right:auto;font-size:20px;cursor:pointer;opacity:.85}
.title .txtact{margin-right:auto;font-size:14.5px;font-weight:620;color:var(--accent);cursor:pointer}
.back{font-size:16px;color:var(--accent);cursor:pointer;padding:14px 19px 0;font-weight:550}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--sep)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.cap{font-size:12.5px;color:var(--muted)}
.lbl{font-size:11.5px;color:var(--muted);font-weight:550}
.h{font-size:15.5px;font-weight:660;margin:0 0 9px}
.big{font-family:var(--num);font-weight:760;letter-spacing:-1.3px;font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums;font-family:var(--num);font-weight:600}
hr.s{border:0;border-top:1px solid var(--sep);margin:11px 0}
.tabbar{position:absolute;bottom:0;left:0;right:0;z-index:55;
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(22px);
  border-top:1px solid var(--sep);display:flex;padding:7px 4px calc(20px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;
  color:var(--muted);cursor:pointer;padding-top:5px;font-weight:550}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--accent)}
.btn{border:0;border-radius:999px;padding:13px 20px;font:inherit;font-weight:640;font-size:15px;
  background:var(--accent);color:#fff;cursor:pointer;width:100%;
  transition:transform .12s cubic-bezier(.2,.8,.2,1),filter .15s}
.btn:active{transform:scale(.965);filter:brightness(.92)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.soft{background:var(--fill);color:var(--ink)}
.btn.dngr{background:rgba(192,57,43,.14);color:var(--red)}
.btn.tiny{padding:9px 13px;font-size:13px;width:auto}
.btn:disabled{opacity:.35;pointer-events:none}
.fab{position:absolute;bottom:calc(96px + env(safe-area-inset-bottom,0px));left:34px;right:34px;z-index:54;
  box-shadow:0 14px 34px rgba(47,85,151,.42)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border-radius:999px;padding:8px 13px;font-size:13.5px;background:var(--fill);
  border:1.5px solid transparent;cursor:pointer;white-space:nowrap;transition:.15s;color:var(--ink)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:640}
.ring{position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-family:var(--num)}
.bar{height:9px;border-radius:5px;background:var(--fill);overflow:hidden;position:relative}
.bar i{position:absolute;inset-block:0;right:0;border-radius:5px;display:block;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.tx{display:flex;align-items:center;gap:10px;padding:9px 0}
.ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:15px}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:70;opacity:0;pointer-events:none;transition:.25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:71;background:var(--bg);
  border-radius:24px 24px 0 0;transform:translateY(101%);
  transition:transform .34s cubic-bezier(.32,.72,0,1);max-height:94%;display:flex;flex-direction:column}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--fill);margin:9px auto 4px;flex:none}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:8px 16px;flex:none}
.key{background:var(--card);border:1px solid var(--sep);border-radius:14px;height:46px;font:inherit;
  font-size:20px;font-family:var(--num);font-weight:600;cursor:pointer;transition:transform .1s;color:var(--ink)}
.key:active{transform:scale(.94);background:var(--fill)}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;margin:0 16px;flex:none}
.seg div{flex:1;text-align:center;padding:7px;border-radius:8px;font-size:14px;cursor:pointer;font-weight:550}
.seg div.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:650}
.fld{width:100%;padding:12px;border-radius:12px;border:1px solid var(--sep);font:inherit;
  font-size:16px;background:var(--card);margin-top:5px;color:var(--ink)}
.sw{width:47px;height:28px;border-radius:999px;cursor:pointer;position:relative;transition:.2s;flex:none}
.sw i{width:22px;height:22px;border-radius:50%;background:#fff;position:absolute;top:3px;transition:.2s;display:block}
.swatch{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2.5px solid transparent}
.swatch.on{border-color:var(--ink)}
.toast{position:absolute;bottom:calc(150px + env(safe-area-inset-bottom,0px));left:16px;right:16px;z-index:90;
  background:rgba(28,28,30,.95);color:#fff;padding:12px 16px;border-radius:16px;font-size:14px;
  opacity:0;transform:translateY(14px);transition:.28s;backdrop-filter:blur(10px);font-weight:550;
  display:flex;align-items:center;gap:10px;pointer-events:none}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast button{background:rgba(255,255,255,.2);border:0;color:#fff;font:inherit;font-weight:650;
  padding:7px 13px;border-radius:999px;cursor:pointer;font-size:13px}
.wiz{position:absolute;inset:0;z-index:95;background:var(--bg);display:flex;flex-direction:column}
.hidden{display:none!important}
.fade{animation:fade .3s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pulse{animation:pulse .5s}
@keyframes pulse{0%{transform:scale(1)}35%{transform:scale(1.06)}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root">
  <div class="safe"></div>
  <div class="view" id="view"></div>
  <button class="btn fab hidden" id="fab" onclick="openSheet('e')">＋ &nbsp;רישום מהיר</button>
  <div class="tabbar" id="tabbar">
    <div class="tab on" data-t="home" onclick="go('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 10l9-7 9 7v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>בית</div>
    <div class="tab" data-t="goals" onclick="go('goals')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/></svg>חסכונות</div>
    <div class="tab" data-t="tx" onclick="go('tx')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 6h16M4 12h16M4 18h10"/></svg>תנועות</div>
    <div class="tab" data-t="ai" onclick="go('ai')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>תובנות</div>
  </div>

  <div class="scrim" id="scrim" onclick="closeAll()"></div>

  <div class="sheet" id="sheet">
    <div class="grab"></div>
    <div style="text-align:center;padding:0 0 8px;flex:none">
      <div class="big" id="amt" style="font-size:46px">0</div>
      <div class="cap" id="amtSub">₪</div></div>
    <div class="seg" id="kindSeg">
      <div id="sg0" onclick="setKind('e')">הוצאה</div>
      <div id="sg1" onclick="setKind('i')">הכנסה</div>
      <div id="sg2" onclick="setKind('t')">העברה</div></div>
    <div style="padding:12px 16px 0;overflow-y:auto;flex:1" id="sheetBody"></div>
    <div class="keys" id="keypad">
      <button class="key" onclick="k('1')">1</button><button class="key" onclick="k('2')">2</button><button class="key" onclick="k('3')">3</button>
      <button class="key" onclick="k('4')">4</button><button class="key" onclick="k('5')">5</button><button class="key" onclick="k('6')">6</button>
      <button class="key" onclick="k('7')">7</button><button class="key" onclick="k('8')">8</button><button class="key" onclick="k('9')">9</button>
      <button class="key" onclick="k('.')">.</button><button class="key" onclick="k('0')">0</button>
      <button class="key" onclick="k('b')" ontouchstart="holdB(1)" ontouchend="holdB(0)" onmousedown="holdB(1)" onmouseup="holdB(0)">⌫</button>
    </div>
    <div style="padding:6px 16px calc(22px + env(safe-area-inset-bottom,0px));flex:none">
      <button class="btn" id="saveBtn" onclick="save()">שמור</button></div>
  </div>

  <div class="sheet" id="form">
    <div class="grab"></div>
    <div style="padding:4px 19px 0;font-size:19px;font-weight:720" id="formTitle"></div>
    <div style="padding:10px 19px 0;overflow-y:auto;flex:1" id="formBody"></div>
    <div style="padding:12px 19px calc(22px + env(safe-area-inset-bottom,0px));display:flex;gap:9px;flex:none">
      <button class="btn soft" style="flex:1" onclick="closeAll()">ביטול</button>
      <button class="btn" style="flex:2" id="formOk">שמור</button></div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="wiz hidden" id="wiz"></div>
</div>
<script>
/* ================================================================
   אחסון מתמיד — שלוש שכבות, לפי הסביבה
   1. window.storage  (תצוגה מקדימה של Claude)
   2. localStorage    (ספארי / כרום — כשהקובץ נשמר במכשיר)
   3. זיכרון בלבד     (מוצא אחרון)
================================================================ */
const KEY='budget_app_v1';
let MEM=null, STORE_MODE='memory';
const DB={
  async load(){
    try{ if(window.storage){const r=await window.storage.get(KEY);
      if(r&&r.value){STORE_MODE='cloud';return JSON.parse(r.value)} STORE_MODE='cloud';return null} }catch(e){}
    try{ const v=localStorage.getItem(KEY); STORE_MODE='local'; return v?JSON.parse(v):null }catch(e){}
    return MEM;
  },
  async save(o){
    const s=JSON.stringify(o);
    try{ if(window.storage){await window.storage.set(KEY,s);MEM=o;return true} }catch(e){}
    try{ localStorage.setItem(KEY,s);MEM=o;return true }catch(e){}
    MEM=o;return false;
  },
  async wipe(){
    try{ if(window.storage){await window.storage.delete(KEY)} }catch(e){}
    try{ localStorage.removeItem(KEY) }catch(e){}
    MEM=null;
  }
};

/* ================================================================ */
const PRESET=[
  {g:'דיור וחשבונות',e:'🏠',c:'--purple',items:[
    ['שכר דירה / משכנתא','🏠',0],['ארנונה','🧾',0],['חשמל','💡',0],['מים','🚰',0],
    ['אינטרנט וסלולר','📶',0],['ועד בית','🏢',0],['ציוד לבית','🛋️',0]]},
  {g:'תחבורה',e:'🚗',c:'--orange',items:[
    ['דלק','⛽',0],['ביטוח וטסט','🔧',0],['טיפולים ותקלות','🛠️',0],['תחבורה ציבורית','🚌',0],['חניה','🅿️',0]]},
  {g:'סופר ומצרכים',e:'🛒',c:'--green',items:[
    ['קניות סופר','🛒',0],['טואלטיקה וניקיון','🧴',0]]},
  {g:'פנאי ואורח חיים',e:'✨',c:'--pink',items:[
    ['אוכל בחוץ ומשלוחים','🍽️',0],['בילויים','🎟️',0],['מנויים דיגיטליים','📺',0],
    ['ספורט וכושר','🏋️',0],['קניות אישיות','👕',0]]},
  {g:'רזרבה ובלת״מ',e:'🛡️',c:'--gray',items:[
    ['מתנות ואירועים','🎁',0],['בריאות','💊',0],['בלת״מ','❓',0]]},
];
const EMOJIS=['🎯','🚗','🏠','✈️','💍','🎓','🛡️','📱','💻','🎸','🎁','🏝️','🛋️','⛽','🛒','🍽️','📺','💊','👕','🧾'];
const COLORS=['--blue','--green','--pink','--purple','--orange','--teal','--gray'];
const DUR=[{l:'ללא הגבלה',v:null},{l:'3 חודשים',v:3},{l:'6 חודשים',v:6},{l:'12 חודשים',v:12},
           {l:'24 חודשים',v:24},{l:'36 חודשים',v:36}];

let D=null, uid=1;
const nid=()=>'x'+(Date.now().toString(36))+(uid++).toString(36);

function blank(){
  return {v:1,setup:false,dark:null,
    profile:{income:0,salaryDay:10,variable:false},
    baseline:0, baselineDate:iso(new Date()),
    cycle:{no:1,start:iso(new Date()),end:iso(addM(new Date(),1)),income:0},
    groups:[],cats:[],goals:[],fixed:[],plans:[],tx:[],cycles:[],
    srcs:[{id:'s1',n:'אשראי',bill:10},{id:'s2',n:'עו״ש',bill:null},{id:'s3',n:'מזומן',bill:null}],
    notif:{morning:1,evening:1,alerts:1,mTime:'08:00',eTime:'21:00'},
    insightIx:0, seen:{}};
}

/* ---------- תאריכים אמיתיים ---------- */
function iso(d){return new Date(d).toISOString()}
function addM(d,n){const x=new Date(d);const day=x.getDate();x.setMonth(x.getMonth()+n);
  if(x.getDate()<day)x.setDate(0);return x}
function addD(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function sod(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
function dayDiff(a,b){return Math.round((sod(b)-sod(a))/864e5)}
const HE_M=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const HE_D=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
function fShort(d){d=new Date(d);return d.getDate()+' '+HE_M[d.getMonth()].slice(0,3)}
function fFull(d){d=new Date(d);const n=dayDiff(d,new Date());
  if(n===0)return 'היום';if(n===1)return 'אתמול';if(n===2)return 'שלשום';
  if(n<7&&n>0)return 'יום '+HE_D[d.getDay()];
  return d.getDate()+' ב'+HE_M[d.getMonth()]}
function fMonth(d){d=new Date(d);return HE_M[d.getMonth()]+' '+d.getFullYear()}
function fInput(d){d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

/* ---------- כסף ---------- */
const nis=v=>'₪'+Math.round(v).toLocaleString('en-US');
const nis2=v=>'₪'+(Math.round(v*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const grp=(v)=>{const [a,b]=String(v).split('.');
  return Number(a||0).toLocaleString('en-US')+(b!==undefined?'.'+b:'')};

/* ---------- שליפות ---------- */
const cat=id=>D.cats.find(c=>c.id===id);
const grpOf=id=>{const c=cat(id);return c?D.groups.find(g=>g.id===c.gid):null};
const catColor=id=>{const g=grpOf(id);return g?g.c:'--gray'};
const catEmoji=id=>{const c=cat(id);return c?c.e:'💳'};
const catName=id=>{const c=cat(id);return c?c.n:'ללא סעיף'};
const src=id=>D.srcs.find(s=>s.id===id);
const goal=id=>D.goals.find(g=>g.id===id);
const liveCats=()=>D.cats.filter(c=>!c.arch);
const liveFixed=()=>D.fixed.filter(f=>!f.paused&&(f.left===null||f.left>0));
const livePlans=()=>D.plans.filter(p=>p.left>0);

const inCycle=()=>{const a=new Date(D.cycle.start);
  return D.tx.filter(t=>new Date(t.date)>=sod(a))};
const cycleOut=()=>inCycle().filter(t=>t.kind==='e').reduce((s,t)=>s+t.a,0);
const cycleIn=()=>inCycle().filter(t=>t.kind==='i').reduce((s,t)=>s+t.a,0);
const cycleDep=()=>inCycle().filter(t=>t.kind==='g').reduce((s,t)=>s+t.a,0);
const cycleWdr=()=>inCycle().filter(t=>t.kind==='w').reduce((s,t)=>s+t.a,0);
const netSaved=()=>cycleDep()-cycleWdr();
const balance=()=>D.baseline+D.tx.filter(t=>new Date(t.date)>=new Date(D.baselineDate))
  .reduce((s,t)=>s+(t.kind==='i'||t.kind==='w'?t.a:-t.a),0);
const goalTotal=()=>D.goals.reduce((s,g)=>s+g.cur,0);

const chargedKey=()=>'c'+D.cycle.no;
const pendFixed=()=>liveFixed().filter(f=>f.last!==chargedKey());
const pendPlans=()=>livePlans().filter(p=>p.last!==chargedKey());
const upcoming=()=>pendFixed().reduce((s,f)=>s+f.a,0)+pendPlans().reduce((s,p)=>s+p.per,0);
const nextCommit=()=>liveFixed().reduce((s,f)=>s+f.a,0)+livePlans().reduce((s,p)=>s+p.per,0);
const futureTotal=()=>livePlans().reduce((s,p)=>s+p.per*p.left,0)
  +liveFixed().filter(f=>f.left).reduce((s,f)=>s+f.a*f.left,0);
const daysLeft=()=>Math.max(1,dayDiff(new Date(),new Date(D.cycle.end)));
const cycleDay=()=>Math.max(1,dayDiff(new Date(D.cycle.start),new Date())+1);
const cycleLen=()=>Math.max(1,dayDiff(new Date(D.cycle.start),new Date(D.cycle.end)));
const income=()=>Math.max(D.cycle.income,cycleIn(),D.profile.income);
const leftMonth=()=>income()-cycleOut()-netSaved()-upcoming();
const safeDay=()=>Math.max(0,leftMonth()/daysLeft());
const spentToday=()=>D.tx.filter(t=>t.kind==='e'&&dayDiff(new Date(t.date),new Date())===0)
  .reduce((s,t)=>s+t.a,0);
const spentOn=id=>inCycle().filter(t=>t.cat===id&&t.kind==='e').reduce((s,t)=>s+t.a,0);
const planOf=id=>{const c=cat(id);return c?c.plan:0};

/* ================================================================
   שלד: ניווט, שמירה, טוסט עם ביטול
================================================================ */
let tab='home', sub=null, subArg=null, undoBuf=null;
let saveT=null;
function persist(){clearTimeout(saveT);saveT=setTimeout(()=>DB.save(D),120)}
function commit(){persist();render()}

function go(t){tab=t;sub=null;
  document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.dataset.t===t));
  render();view.scrollTop=0}
function open2(s,a){sub=s;subArg=a;render();view.scrollTop=0}

function toast(msg,undo){
  const t=document.getElementById('toast');
  t.innerHTML=`<span style="flex:1">${msg}</span>`+(undo?`<button onclick="doUndo()">בטל</button>`:'');
  t.classList.add('on');clearTimeout(t._x);
  t._x=setTimeout(()=>{t.classList.remove('on');undoBuf=null},undo?6000:2200);
}
function doUndo(){
  if(!undoBuf)return;
  undoBuf();undoBuf=null;
  document.getElementById('toast').classList.remove('on');
  commit();toast('הפעולה בוטלה');
}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms||12)}catch(e){}}

/* ---------- מצב כהה ---------- */
function applyTheme(){
  const sys=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  const on = D.dark===null ? sys : D.dark;
  document.documentElement.classList.toggle('dark',!!on);
}

/* ================================================================
   טופס גנרי
================================================================ */
let FS={};
function openForm(title,fields,onOk,okLabel){
  FS={};fields.forEach(f=>FS[f.k]=f.v??'');
  document.getElementById('formTitle').textContent=title;
  document.getElementById('formBody').innerHTML=fields.map(f=>{
    if(f.t==='emoji')return `<div class="lbl" style="margin-top:13px">${f.l}</div>
      <div class="chips wrap" style="margin-top:5px">${EMOJIS.map(e=>
        `<div class="chip ${e===f.v?'on':''}" onclick="setF('${f.k}','${e}',this)">${e}</div>`).join('')}</div>`;
    if(f.t==='color')return `<div class="lbl" style="margin-top:13px">${f.l}</div>
      <div class="row" style="gap:10px;margin-top:7px">${COLORS.map(c=>
        `<div class="swatch ${c===f.v?'on':''}" style="background:var(${c})" onclick="setF('${f.k}','${c}',this)"></div>`).join('')}</div>`;
    if(f.t==='select')return `<div class="lbl" style="margin-top:13px">${f.l}</div>
      <div class="chips wrap" style="margin-top:5px">${f.opts.map((o,i)=>
        `<div class="chip ${i===f.v?'on':''}" onclick="setF('${f.k}',${i},this)">${o}</div>`).join('')}</div>`;
    if(f.t==='date')return `<div class="lbl" style="margin-top:13px">${f.l}</div>
      <input class="fld" type="date" value="${f.v||''}" onchange="FS['${f.k}']=this.value">`;
    if(f.t==='switch')return `<div class="row" style="margin-top:15px">
      <div style="font-size:15px">${f.l}</div><div class="sp"></div>
      <div class="sw" id="sw_${f.k}" onclick="togF('${f.k}')"
        style="background:${f.v?'var(--green)':'var(--fill)'}">
        <i style="${f.v?'left:3px':'right:3px'}"></i></div></div>`;
    if(f.t==='note')return `<div class="cap" style="margin-top:13px;line-height:1.55">${f.l}</div>`;
    return `<div class="lbl" style="margin-top:13px">${f.l}</div>
      <input class="fld" type="${f.t==='num'?'number':'text'}" inputmode="${f.t==='num'?'decimal':'text'}"
        value="${f.v??''}" placeholder="${f.p||''}" oninput="FS['${f.k}']=this.value">`;
  }).join('')+'<div style="height:8px"></div>';
  document.getElementById('formOk').textContent=okLabel||'שמור';
  document.getElementById('formOk').onclick=()=>onOk(FS);
  scrim.classList.add('on');form.classList.add('on');
}
function setF(k,v,el){FS[k]=v;[...el.parentElement.children].forEach(c=>c.classList.remove('on'));el.classList.add('on')}
function togF(k){FS[k]=!FS[k];const el=document.getElementById('sw_'+k);
  el.style.background=FS[k]?'var(--green)':'var(--fill)';
  el.firstElementChild.style.cssText=FS[k]?'left:3px':'right:3px'}
function closeAll(){scrim.classList.remove('on');sheet.classList.remove('on');form.classList.remove('on')}

function confirmDo(title,body,label,fn){
  openForm(title,[{t:'note',k:'_',l:body}],()=>{closeAll();fn()},label);
}

/* ================================================================
   גיליון רישום / העברה / עריכה
================================================================ */
let kind='e',dir='in',amt='',selSrc=null,selCat=null,selGoal=null,sugg=null,
    payN=1,payFor='',txDate=null,editId=null,noteVal='';

function openSheet(k0,opt){
  opt=opt||{};
  kind=k0||'e';dir=opt.dir||'in';amt=opt.amt||'';payN=1;payFor='';sugg=null;
  editId=opt.edit||null;noteVal=opt.note||'';
  selCat=opt.cat||null;selGoal=opt.goal||(D.goals[0]&&D.goals[0].id)||null;
  selSrc=opt.src||(D.srcs[0]&&D.srcs[0].id);
  txDate=opt.date||fInput(new Date());
  document.getElementById('kindSeg').classList.toggle('hidden',!!editId);
  segPaint();drawSheet();paint();
  scrim.classList.add('on');sheet.classList.add('on');
}
function segPaint(){[0,1,2].forEach(i=>
  document.getElementById('sg'+i).classList.toggle('on',i==={e:0,i:1,t:2}[kind]))}
function setKind(k0){kind=k0;selCat=null;sugg=null;payN=1;segPaint();drawSheet();paint()}
function k(x){
  buzz(8);
  if(x==='b')amt=amt.slice(0,-1);
  else if(x==='.'){if(!amt.includes('.')&&amt)amt+='.'}
  else{if(amt.includes('.')&&amt.split('.')[1].length>=2)return;
    if(amt.replace('.','').length>=9)return;amt+=x}
  paint();
}
let holdT=null;
function holdB(on){if(on){holdT=setTimeout(()=>{amt='';paint();buzz(25)},550)}else clearTimeout(holdT)}
function paint(){
  const el=document.getElementById('amt');
  el.textContent=amt?grp(amt):'0';
  el.style.color=(kind==='i'||(kind==='t'&&dir==='out'))?'var(--green)':'var(--ink)';
  const v=parseFloat(amt)>0;
  document.getElementById('amtSub').textContent =
    kind==='t'&&payN<=1 ? '₪ · העברה בין כיסים' : (payN>1&&v? '₪ · '+nis(parseFloat(amt)/payN)+' לחודש' : '₪');
  const btn=document.getElementById('saveBtn');

function esc(s){return String(s||'').replace(/"/g,'&quot;')}
function quickCombos(){
  const m={};
  D.tx.filter(t=>t.kind==='e'&&t.cat).slice(0,60).forEach(t=>{
    const k=t.cat+'|'+Math.round(t.a);m[k]=(m[k]||0)+1});
  const top=Object.entries(m).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>=2).slice(0,3);
  if(!top.length)return '';
  return `<div class="chips" style="margin:5px 0 9px">${top.map(([k])=>{
    const [cid,a]=k.split('|');
    return `<div class="chip" style="background:var(--accent-soft);color:var(--accent);font-weight:640"
      onclick="quickFill('${cid}',${a})">${catEmoji(cid)} ${nis(+a)} · ${catName(cid)}</div>`}).join('')}</div>`;
}
function quickFill(cid,a){amt=String(a);selCat=cid;drawSheet();paint();buzz()}
function setDir(d){dir=d;noteVal='';drawSheet();paint()}
function pickGoal(id){selGoal=id;drawSheet();paint()}
function pickCat(id){selCat=id;sugg=null;drawSheet();paint()}
function togglePay(){payN=payN>1?1:(D.seen.lastPayN||3);drawSheet();paint()}
function setPayN(n){payN=n;D.seen.lastPayN=n;drawSheet();paint()}

const HINTS={'פז':'דלק','דלק':'דלק','תדלוק':'דלק','סונול':'דלק','דור אלון':'דלק',
 'שופרסל':'סופר','רמי לוי':'סופר','ויקטורי':'סופר','יוחננוף':'סופר','אושר עד':'סופר','טיב טעם':'סופר',
 'משלוח':'אוכל','וולט':'אוכל','wolt':'אוכל','תן ביס':'אוכל','מסעדה':'אוכל','קפה':'אוכל','בורגר':'אוכל',
 'נטפליקס':'מנוי','ספוטיפיי':'מנוי','יוטיוב':'מנוי','דיסני':'מנוי',
 'חשמל':'חשמל','מים':'מים','ארנונה':'ארנונה','קולנוע':'בילוי','סופר-פארם':'טואלטיקה'};
function suggest(){
  if(selCat)return;const v=noteVal.trim();sugg=null;
  for(const key in HINTS){ if(v.includes(key)){
    const hit=liveCats().find(c=>c.n.includes(HINTS[key]));
    if(hit){sugg=hit;break} } }
  const box=document.getElementById('suggBox');if(!box)return;
  if(sugg&&v.length>=2){document.getElementById('suggName').textContent=sugg.n;box.classList.remove('hidden')}
  else box.classList.add('hidden');
}
function acceptSugg(){if(sugg){selCat=sugg.id;sugg=null;drawSheet();paint()}}

/* ---------- שמירת תנועה ---------- */
function save(){
  const a=parseFloat(amt), dt=iso(new Date(txDate+'T'+new Date().toTimeString().slice(0,8)));
  if(editId){
    const t=D.tx.find(x=>x.id===editId);const before=JSON.parse(JSON.stringify(t));
    if(t.kind==='g'||t.kind==='w'){const g=goal(t.goal);
      if(g){g.cur+= (t.kind==='g'?-t.a:t.a); g.cur+= (t.kind==='g'?a:-a)}}
    Object.assign(t,{a,date:dt,cat:kind==='e'?selCat:t.cat,src:selSrc,note:noteVal});
    undoBuf=()=>{const x=D.tx.find(y=>y.id===editId);Object.assign(x,before)};
    closeAll();commit();toast('התנועה עודכנה',1);return;
  }
  if(kind==='t'){
    const g=goal(selGoal);if(!g)return;
    if(dir==='in'&&a>balance()){toast('אין מספיק יתרה זמינה');return}
    if(dir==='out'&&a>g.cur){toast('אין מספיק בקופה');return}
    g.cur+= dir==='in'? a : -a;
    const t={id:nid(),a,date:dt,kind:dir==='in'?'g':'w',goal:g.id,src:selSrc,
      note:noteVal||((dir==='in'?'הפקדה ל':'משיכה מ')+g.n)};
    D.tx.unshift(t);
    undoBuf=()=>{g.cur-= dir==='in'? a:-a;D.tx=D.tx.filter(x=>x.id!==t.id)};
    closeAll();commit();toast((dir==='in'?'הופקד ':'נמשך ')+nis(a)+' · '+g.n,1);return;
  }
  if(kind==='i'){
    const t={id:nid(),a,date:dt,kind:'i',src:selSrc,note:noteVal||'הכנסה'};
    D.tx.unshift(t);undoBuf=()=>{D.tx=D.tx.filter(x=>x.id!==t.id)};
    closeAll();commit();toast('נרשמה הכנסה '+nis(a),1);
    if(a>=(D.profile.income||0)*0.6&&a>1000)setTimeout(()=>askSalary(a),450);
    return;
  }
  if(payN>1){
    const per=Math.round(a/payN);
    const p={id:nid(),n:payFor||catName(selCat),cat:selCat,total:a,cnt:payN,per,
      left:payN-1,day:(src(selSrc)||{}).bill||2,note:payFor||noteVal||'עסקה בתשלומים',last:chargedKey()};
    D.plans.push(p);
    const t={id:nid(),a:per,date:dt,kind:'e',cat:selCat,src:selSrc,plan:p.id,
      note:(payFor||noteVal||catName(selCat))+' · תשלום 1/'+payN};
    D.tx.unshift(t);
    undoBuf=()=>{D.plans=D.plans.filter(x=>x.id!==p.id);D.tx=D.tx.filter(x=>x.id!==t.id)};
    closeAll();commit();toast('נפרס ל-'+payN+' תשלומים של '+nis(per),1);return;
  }
  const t={id:nid(),a,date:dt,kind:'e',cat:selCat,src:selSrc,note:noteVal};
  D.tx.unshift(t);undoBuf=()=>{D.tx=D.tx.filter(x=>x.id!==t.id)};
  closeAll();commit();
  const sd=safeDay(),st=spentToday();
  toast('נרשם '+nis(a)+(st>sd&&sd>0?' · עברת את התקציב היומי':''),1);
}
function editTx(id){
  const t=D.tx.find(x=>x.id===id);if(!t)return;
  if(t.kind==='g'||t.kind==='w'){
    openSheet('t',{edit:id,amt:String(t.a),goal:t.goal,note:t.note,date:fInput(t.date),
      dir:t.kind==='g'?'in':'out',src:t.src});
  } else {
    openSheet(t.kind==='i'?'i':'e',{edit:id,amt:String(t.a),cat:t.cat,src:t.src,
      note:t.note,date:fInput(t.date)});
  }
}
function delTx(id){
  const i=D.tx.findIndex(x=>x.id===id);if(i<0)return;
  const t=D.tx[i];
  if(t.kind==='g'||t.kind==='w'){const g=goal(t.goal);if(g)g.cur+= t.kind==='g'?-t.a:t.a}
  D.tx.splice(i,1);
  undoBuf=()=>{D.tx.splice(i,0,t);
    if(t.kind==='g'||t.kind==='w'){const g=goal(t.goal);if(g)g.cur+= t.kind==='g'?t.a:-t.a}};
  closeAll();commit();toast('התנועה נמחקה',1);
}

/* ---------- מחזור ---------- */
function askSalary(a){
  openForm('זו המשכורת החודשית?',[
    {t:'note',k:'_',l:'פתיחת מחזור חדש סוגרת את הנוכחי, מפיקה דוח תכנון־מול־ביצוע, ומאפסת את ההוצאות הקבועות והתשלומים לחודש הבא.'}
  ],()=>{closeAll();closeCycle(a)},'כן, פתח מחזור חדש');
}
function closeCycle(inc){
  const rows=perf();
  D.cycles.unshift({no:D.cycle.no,start:D.cycle.start,end:iso(new Date()),
    income:income(),rows,saved:netSaved(),out:cycleOut()});
  D.cycle={no:D.cycle.no+1,start:iso(new Date()),end:iso(addM(new Date(),1)),income:inc||0};
  if(inc)D.profile.income=inc;
  commit();go('ai');toast('מחזור '+(D.cycle.no-1)+' נסגר · הדוח נשמר');
}
function perf(){
  const out=[];
  D.groups.forEach(g=>D.cats.filter(c=>c.gid===g.id).forEach(c=>{
    const act=spentOn(c.id);
    if(c.plan>0||act>0)out.push({g:g.n,gc:g.c,ge:g.e,n:c.n,e:c.e,plan:c.plan,act,note:c.note||''});
  }));
  return out;
}

function ring(p,color,size=56,w=8,label){
  const r=(size-w)/2,C=2*Math.PI*r;
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}">
   <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(${color})" stroke-opacity=".16" stroke-width="${w}" fill="none"/>
   <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(${color})" stroke-width="${w}" fill="none"
    stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.max(0,Math.min(1,p)))}"/></svg>
   <b>${label??Math.round(p*100)+'%'}</b></div>`;
}
function txRow(t,showBal){
  const g=t.kind==='g',w=t.kind==='w',i=t.kind==='i';
  const col=g?'--blue':(w||i)?'--green':catColor(t.cat);
  const em=g?'🎯':w?'↩️':i?'💰':catEmoji(t.cat);
  const ttl=t.note|| (g||w?(goal(t.goal)||{}).n:catName(t.cat)) || 'תנועה';
  return `<div class="tx" onclick="editTx('${t.id}')" style="cursor:pointer">
    <div class="ic" style="background:color-mix(in srgb,var(${col}) 15%,transparent)">${em}</div>
    <div style="min-width:0;flex:1"><div style="font-size:14.5px;font-weight:560;
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ttl}</div>
      <div class="cap" style="font-size:11.5px">${g||w?'קופה':catName(t.cat)}${t.src?' · '+(src(t.src)||{}).n:''}</div></div>
    <div style="text-align:left"><div class="mono" style="font-size:14.5px;
      color:${g?'var(--blue)':(w||i)?'var(--green)':'inherit'}">${w||i?'+':''}${nis(t.a)}</div>
      <div class="cap" style="font-size:11px">${fShort(t.date)}</div></div></div>`;
}

function filtered(){
  let a=D.tx.slice();
  if(fRange==='cycle')a=a.filter(t=>new Date(t.date)>=sod(new Date(D.cycle.start)));
  else if(fRange!=='all'){const n=+fRange;a=a.filter(t=>dayDiff(new Date(t.date),new Date())<=n)}
  if(fSrc)a=a.filter(t=>t.src===fSrc);
  if(fGrp)a=a.filter(t=>{const c=cat(t.cat);return c&&c.gid===fGrp});
  if(fQ.trim()){const q=fQ.trim();a=a.filter(t=>((t.note||'')+' '+catName(t.cat)).includes(q))}
  return a.sort((x,y)=>new Date(y.date)-new Date(x.date));
}

  const now=new Date();let d=new Date(now.getFullYear(),now.getMonth(),day);

  return dayDiff(now,d);
}

function notes(){
  const sd=safeDay(),st=spentToday(),lm=leftMonth(),up=upcoming(),o=[];
  const pct=sd>0?Math.round(st/sd*100):0;
  if(sd>0&&st>sd) o.push({ic:'⚠️',ti:'עכשיו',t:`שים לב — היום הוצאת ${nis(st)}`,
    b:`זה ${pct}% מהתקציב היומי (${nis(sd)}). לא נורא, אבל כדאי שהמחר יהיה רגוע יותר.`});
  else if(sd>0&&st>sd*0.7) o.push({ic:'👀',ti:'עכשיו',t:`ניצלת ${pct}% מהתקציב היומי`,
    b:`הוצאת ${nis(st)} מתוך ${nis(sd)}. נשארו ${nis(Math.max(0,sd-st))} להיום.`});
  if(D.notif.morning) o.push({ic:'☀️',ti:D.notif.mTime,t:`בוקר טוב! התקציב היומי שלך הוא ${nis(sd)}`,
    b:`${daysLeft()} ימים למשכורת הבאה. זה המספר היחיד שצריך לזכור היום.`});
  if(D.notif.evening) o.push({ic:'🌙',ti:D.notif.eTime,t:`ערב טוב! נשארו לך ${nis(Math.max(0,lm))} לחודש`,
    b:`שיוצא בממוצע ${nis(sd)} ליום ל-${daysLeft()} הימים הבאים.${st>0?` היום הוצאת ${nis(st)}.`:' היום עוד לא רשמת כלום.'}`});
  const soon=pendFixed().concat(pendPlans().map(p=>({n:p.n,a:p.per,day:p.day})))
    .filter(x=>nextChargeIn(x.day)<=5);
  if(soon.length) o.push({ic:'📅',ti:'תזכורת',t:`${nis(soon.reduce((s,x)=>s+x.a,0))} יורדים בימים הקרובים`,
    b:soon.map(x=>`${x.n} (${nis(x.a)}, בעוד ${nextChargeIn(x.day)} ימים)`).join(' · ')});
  if(nextCommit()>0) o.push({ic:'🧾',ti:'לפני משכורת',t:`${nis(nextCommit())} מהמשכורת הבאה כבר מחויבים`,
    b:`הוצאות קבועות ותשלומים. פנוי באמת: ${nis(Math.max(0,income()-nextCommit()))}.`});
  const g=D.goals.slice().sort((a,b)=>(b.cur/(b.tgt||1))-(a.cur/(a.tgt||1)))[0];
  if(g&&g.tgt) o.push({ic:'🎯',ti:'התקדמות',t:`${g.n} עבר ${Math.round(g.cur/g.tgt*100)}%`,
    b:`${nis(g.cur)} מתוך ${nis(g.tgt)}.${g.per>0?` בקצב הנוכחי תגיע בעוד ${Math.ceil((g.tgt-g.cur)/g.per)} חודשים.`:''}`});
  if(!D.tx.some(t=>dayDiff(new Date(t.date),new Date())===0))
    o.push({ic:'✍️',ti:'תזכורת',t:'לא רשמת כלום היום',
      b:'יום בלי רישום הוא לא בהכרח יום בלי הוצאות. שווה דקה לבדוק.'});
  return o;
}

function csv(i){
  const c=D.cycles[i];
  let out='\uFEFF"קטגוריה ראשית","סעיף הוצאה","תקציב מתוכנן","ביצוע בפועל","הפרש","הערות והתנהלות"\r\n';
  c.rows.forEach(r=>{out+=`"${r.g}","${r.n}",${r.plan},${r.act},${r.plan-r.act},"${(r.note||'').replace(/"/g,'""')}"\r\n`});
  dl(out,'budget-'+c.no+'.csv','text/csv;charset=utf-8');
}
function dl(text,name,type){
  const b=new Blob([text],{type:type||'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},400);
}

      <div class="cap" style="margin-top:8px;line-height:1.6">${sub}</div>
      <div style="margin-top:20px">${body}</div></div>
    <div style="padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;gap:9px">
      ${s>0?`<button class="btn soft" style="flex:1" onclick="W.step--;drawWiz()">חזור</button>`:''}
      <button class="btn" style="flex:2" ${ok?'':'disabled'} onclick="wizNext()">${okLbl||'המשך'}</button></div>`;
  let h='';
  if(s===0) h=shell('בוא נכיר','כמה פרטים קצרים, ואז נבנה לך תמונה פיננסית אישית. אפשר לשנות הכל אחר כך.',
    `<div style="font-size:44px;text-align:center;padding:20px 0">💰</div>
     <div class="card"><div class="cap" style="line-height:1.7">
       האפליקציה תעזור לך להבין <b style="color:var(--ink)">כמה באמת פנוי לך להוציא</b>, כמה כדאי לחסוך ומה צפוי לרדת לפני המשכורת הבאה.</div></div>`,1,'מתחילים');
  if(s===1) h=shell('איך קוראים לך?','לא חובה — השם ישמש רק כדי להפוך את האפליקציה לאישית יותר.',
    `<input class="fld" placeholder="למשל: גיא" value="${W.name}" oninput="W.name=this.value" style="font-size:24px;font-weight:650;text-align:center">`,1,'המשך');
  if(s===2) h=shell('כמה יש לך עכשיו בעו״ש?','זו נקודת ההתחלה. מכאן כל תנועה שתירשם תעדכן את היתרה.',
    `<input class="fld" type="number" inputmode="decimal" placeholder="4820" value="${W.bal}"
       oninput="W.bal=this.value" style="font-size:30px;font-weight:700;text-align:center;font-family:var(--num)">
     <div class="cap" style="margin-top:12px;line-height:1.6">אם אתה במינוס — אפשר להזין מספר שלילי. חשוב שהמספר יהיה אמיתי.</div>`,W.bal!=='');
  if(s===3) h=shell('כמה יש לך בחיסכון?','כל כסף שכבר קיים בחיסכון, ולא חלק מהעו״ש.',
    `<input class="fld" type="number" inputmode="decimal" placeholder="8000" value="${W.savings}"
       oninput="W.savings=this.value" style="font-size:30px;font-weight:700;text-align:center;font-family:var(--num)">
     <div class="cap" style="margin-top:12px;line-height:1.6">אפשר להזין 0 אם אין כרגע חיסכון. בהמשך נוכל לנהל קופות ויעדים בנפרד.</div>`,W.savings!=='');
  if(s===4) h=shell('מה המשכורת שלך?','נטו — הסכום שבדרך כלל נכנס לחשבון.',
    `<input class="fld" type="number" inputmode="decimal" placeholder="9800" value="${W.income}"
       oninput="W.income=this.value" style="font-size:30px;font-weight:700;text-align:center;font-family:var(--num)">
     <div class="lbl" style="margin-top:18px">באיזה יום בחודש היא נכנסת?</div>
     <div class="chips wrap" style="margin-top:6px">${[1,5,9,10,15,20,25,28].map(d=>
       `<div class="chip ${W.day==d?'on':''}" onclick="W.day=${d};drawWiz()">ב-${d}</div>`).join('')}</div>`,+W.income>0);
  if(s===5) h=shell('מה בדרך כלל יוצא לך?','סמן את הסעיפים שרלוונטיים אליך. אחר כך נוכל לקבוע תקציב לכל אחד.',
    PRESET.map((g,gi)=>`<div class="card" style="padding:13px">
      <div class="row" style="margin-bottom:8px"><b style="font-size:14.5px;color:var(${g.c})">${g.e} ${g.g}</b></div>
      <div class="chips wrap">${g.items.map((it,ii)=>{const k=gi+'_'+ii;
        return `<div class="chip ${W.picked[k]?'on':''}" onclick="pick('${k}')">${it[1]} ${it[0]}</div>`}).join('')}</div>
    </div>`).join(''),Object.values(W.picked).filter(Boolean).length>0);
  if(s===6){
    const sel=Object.keys(W.picked).filter(k=>W.picked[k]);
    h=shell('כמה לתכנן לכל סעיף?','לא צריך לדייק. זו רק נקודת פתיחה, ונשפר אותה לפי ההתנהלות האמיתית שלך.',
      sel.map(k=>{const [gi,ii]=k.split('_');const it=PRESET[gi].items[ii];
        return `<div class="row" style="padding:7px 0"><div style="flex:1;font-size:14.5px">${it[1]} ${it[0]}</div>
          <input class="fld" type="number" inputmode="decimal" placeholder="0" value="${W.picked[k]===true?'':W.picked[k]}"
            oninput="W.picked['${k}']=this.value||true" style="width:104px;margin:0;text-align:left"></div>`}).join('')
      +`<div class="card" style="margin-top:14px;background:var(--accent-soft);border:0"><div class="cap" style="line-height:1.6;color:var(--ink)">
        לא יודע? השאר 0. אחרי חודש ראשון יהיו לנו נתונים אמיתיים.</div></div>`,1);
  }
  if(s===7) h=shell('רוצה להגדיר יעד חיסכון?','לא חובה. אפשר גם לדלג ולהוסיף קופה בכל רגע.',
    `<input class="fld" placeholder="למשל: רכב, חופשה, כרית ביטחון" value="${W.goalName}" oninput="W.goalName=this.value">
     <div class="row" style="gap:9px;margin-top:9px">
       <input class="fld" type="number" inputmode="decimal" placeholder="סכום יעד" value="${W.goalTgt}" oninput="W.goalTgt=this.value" style="margin:0">
       <input class="fld" type="number" inputmode="decimal" placeholder="הפקדה חודשית" value="${W.goalPer}" oninput="W.goalPer=this.value" style="margin:0"></div>
     <div class="card" style="margin-top:14px;background:var(--accent-soft);border:0"><div class="cap" style="line-height:1.6;color:var(--ink)">
       בסיום נציג לך סיכום של הנתונים לפני שנפתח את האפליקציה.</div></div>`,1,'המשך');
  document.getElementById('wiz').innerHTML=h;
}
function pick(k){W.picked[k]=W.picked[k]?false:true;drawWiz()}
function finishWizard(){
  D=blank();
  D.profile.name=W.name.trim();
  D.profile.income=+W.income||0;
  D.profile.salaryDay=Math.min(31,Math.max(1,+W.day||10));
  D.profile.savings=Math.max(0,+W.savings||0);
  D.profile.lastSalaryDate=iso(new Date());
  D.baseline=+W.bal||0;D.baselineDate=iso(new Date());
  D.cycle={no:1,start:iso(new Date()),end:iso(addM(new Date(),1)),income:+W.income||0,salaryDate:iso(new Date())};
  const gmap={};
  Object.keys(W.picked).filter(k=>W.picked[k]).forEach(k=>{
    const [gi,ii]=k.split('_');const G=PRESET[gi],it=G.items[ii];
    if(!gmap[gi]){const g={id:nid(),n:G.g,e:G.e,c:G.c};D.groups.push(g);gmap[gi]=g.id}
    const v=W.picked[k];const plan=v===true?0:(+v||0);
    D.cats.push({id:nid(),n:it[0],e:it[1],gid:gmap[gi],plan,note:''});
  });
  if(D.profile.savings>0){
    D.goals.push({id:nid(),n:'חיסכון קיים',e:'🏦',c:'--blue',tgt:D.profile.savings,cur:D.profile.savings,per:0,due:null,made:iso(new Date()),type:'חיסכון'});
  }
  if(W.goalName&&+W.goalTgt>0)
    D.goals.push({id:nid(),n:W.goalName,e:'🎯',c:'--teal',tgt:+W.goalTgt,cur:0,per:+W.goalPer||0,due:null,made:iso(new Date()),type:'יעד'});
  D.setup=true;
  document.getElementById('wiz').classList.add('hidden');
  persist();go('home');
  setTimeout(()=>toast('הכל מוכן. עכשיו נתחיל לעקוב אחרי החודש שלך 👇'),500);
}
function wizNext(){
  if(W.step<7){W.step++;drawWiz();return}
  // Show a short confirmation before committing the profile.
  const chosen=Object.keys(W.picked).filter(k=>W.picked[k]).length;
  const totalGoals=(+W.goalTgt>0?1:0);
  const summary=`<div class="card"><div class="row"><div style="flex:1"><div class="lbl">עו״ש</div><div class="big" style="font-size:24px">${nis(+W.bal||0)}</div></div><div style="flex:1"><div class="lbl">חיסכון</div><div class="big" style="font-size:24px">${nis(+W.savings||0)}</div></div></div><hr class="s"><div class="row"><div style="flex:1"><div class="lbl">משכורת</div><div class="big" style="font-size:24px">${nis(+W.income||0)}</div></div><div style="flex:1"><div class="lbl">יום משכורת</div><div class="big" style="font-size:24px">${W.day}</div></div></div><hr class="s"><div class="cap">${chosen} סעיפי תקציב · ${totalGoals?'יעד חיסכון אחד':'ללא יעד חיסכון'}</div></div>`;
  document.getElementById('wiz').innerHTML=`<div class="safe"></div><div style="padding:28px 20px;flex:1;overflow:auto"><div style="font-size:27px;font-weight:760">הכול מוכן 🎉</div><div class="cap" style="margin-top:8px;line-height:1.6">בדוק שהנתונים נכונים. אפשר לשנות אותם גם אחר כך.</div><div style="margin-top:22px">${summary}</div></div><div style="padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px))"><button class="btn" onclick="finishWizard()">פתח את האפליקציה</button><button class="btn soft" style="margin-top:8px" onclick="W.step=6;drawWiz()">חזור וערוך</button></div>`;
}

function currentSalaryMonthKey(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function checkMonthlySalary(){
  if(!D||!D.setup)return;
  const now=new Date();
  const salaryDay=Math.min(31,Math.max(1,+D.profile.salaryDay||10));
  const last=D.profile.lastSalaryDate?new Date(D.profile.lastSalaryDate):null;
  const passed=now.getDate()>=salaryDay;
  const lastMonth=last&&last.getFullYear()===now.getFullYear()&&last.getMonth()===now.getMonth();
  if(passed&&!lastMonth&&!D.seen.salaryPromptMonth){
    D.seen.salaryPromptMonth=currentSalaryMonthKey();
    persist();
    setTimeout(()=>monthlySalaryPrompt(),200);
  }
}
function monthlySalaryPrompt(){
  openForm('משכורת חדשה 💰',[
    {k:'a',l:'כמה נכנס החודש נטו? (₪)',t:'num',v:D.profile.income||'',p:'9800'},
    {k:'bal',l:'יתרה בעו״ש עכשיו (לא חובה)',t:'num',v:'',p:'5200'},
    {t:'note',k:'_',l:'החודש הקודם יישמר בהיסטוריה. המחזור החדש יתחיל עם המשכורת הזו.'}
  ],f=>{
    const a=+f.a||0;
    closeAll();
    if(a<=0){toast('לא עודכנה משכורת');return}
    closeCycle(a);
    D.profile.lastSalaryDate=iso(new Date());
    if(+f.bal){D.baseline=+f.bal;D.baselineDate=iso(new Date())}
    D.seen.salaryPromptMonth=currentSalaryMonthKey();
    const t={id:nid(),a,date:iso(new Date()),kind:'i',src:D.srcs[1]?D.srcs[1].id:null,note:'משכורת'};
    D.tx.unshift(t);
    commit();
    go('home');
    toast('החודש החדש נפתח בהצלחה');
  },'עדכן ופתח חודש');
}

/* ================================================================ */
(async function boot(){
  const saved=await DB.load();
  D = saved && saved.cats ? saved : blank();
  if(!D.seen)D.seen={};
  applyTheme();
  if(!D.setup){wizard()} else {
    render();
    setTimeout(checkMonthlySalary,350);
  }
  window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)')
    .addEventListener&&window.matchMedia('(prefers-color-scheme: dark)')
    .addEventListener('change',()=>{applyTheme()});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&D&&D.setup)render()});
})();
</script>
</body>
</html>
